name: Sync typhoon data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes in UTC, offset from the top of the hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate official source
        run: node scripts/fetch-zj.mjs
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js PLAN.md dist/
          cp data/latest.json dist/data/latest.json
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

